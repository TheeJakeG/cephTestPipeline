name: Student Multi-Pool Scrub Test

on:
  push:
  pull_request:

jobs:
  student-scrub-test:
    runs-on: self-hosted

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify test file exists
        run: |
          test -f qa/standalone/scrub/student-multipool-scrub.sh
          test -x qa/standalone/scrub/student-multipool-scrub.sh

      - name: Run student scrub standalone test
        run: |
          cd /home/cephuser/ceph
          cd build
          script -q -e -c "../qa/run-standalone.sh scrub/student-multipool-scrub.sh" /dev/null
